<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Airframe</title><link rel="icon" href="data:,"><script src="/login.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f6f3;color:#18241d;font:16px/1.5 system-ui,sans-serif}.card{width:min(100%,440px);padding:clamp(24px,6vw,44px);background:white;border:1px solid #dce4dc;border-radius:20px;box-shadow:0 16px 64px #19291b0b}.brand{font-size:28px;font-weight:800;letter-spacing:-1px;color:#287b48}.tag{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#637365;margin-top:32px}h1{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:10px 0 14px}p{color:#637365}label{display:block;font-weight:600;font-size:14px;margin:28px 0 8px}input,button{font:inherit;width:100%;padding:13px 15px;border-radius:9px}input{border:1px solid #a3b4a5}input:focus-visible,button:focus-visible{outline:3px solid #a9d2b8;outline-offset:3px}button{margin-top:20px;border:0;background:#287b48;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.7;cursor:wait}#error{color:#a32f2f;font-size:14px;min-height:22px;margin-bottom:0}.foot{font-size:12px;border-top:1px solid #e7ece7;padding-top:20px;margin-top:24px}
</style></head><body><main class="card"><div class="brand">airframe.</div><div class="tag">Private workspace</div><h1>A better service day<br>starts here.</h1><p>Sign in to manage your HVAC customers, jobs and invoices.</p><form id="login-form"><label for="password">Workspace password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512" autofocus><p id="error" role="alert"></p><button type="submit">Sign in to workspace →</button></form><p class="foot">Single-company test workspace · Session lasts up to 8 hours. Use Sign out on shared devices.</p></main></body></html>
